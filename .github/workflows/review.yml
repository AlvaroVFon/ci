name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    uses: AlvaroVFon/ci/.github/workflows/code-review.yml@v8
    with:
      model: opencode-go/deepseek-v4.1-flash
      # Skills main with the bot and the check-annotation fix.
      skills-ref: 475c24630e53e23438afd6551ab36aa5dcb7ce73
      ci-ref: v8
      oidc-client-id: sk_bfa81d64-af1d-4242-b093-5cefe33c6956
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
