name: code-review

on:
  workflow_call:
    inputs:
      model:
        description: "OpenCode model in provider/model format, for example opencode-go/deepseek-v4.1-flash"
        required: true
        type: string
      skills-ref:
        description: "Tag or commit of AlvaroVFon/skills that provides the code-review skill"
        required: true
        type: string
      ci-ref:
        description: "Tag or commit of AlvaroVFon/ci that provides the scripts; must match the ref this workflow was called at"
        required: true
        type: string
      oidc-client-id:
        description: "Client id shown by the Console for the GitHub Actions key; empty falls back to the secret"
        required: false
        type: string
        default: "sk_bfa81d64-af1d-4242-b093-5cefe33c6956"
    secrets:
      OPENCODE_API_KEY:
        required: false

jobs:
  review:
    name: Review pull request
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: code-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout skills
        uses: actions/checkout@v7
        with:
          repository: AlvaroVFon/skills
          ref: ${{ inputs.skills-ref }}
          path: .skills
          persist-credentials: false

      - name: Checkout workflow scripts
        uses: actions/checkout@v7
        with:
          repository: AlvaroVFon/ci
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Sign in to OpenCode
        env:
          OIDC_CLIENT_ID: ${{ inputs.oidc-client-id }}
          STATIC_OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash .ci/scripts/sign-in.sh

      - name: Check OpenCode key
        run: bash .ci/scripts/check-provider-key.sh

      - name: Install the skill and the reviewer policies
        env:
          SKILL_PATH: .skills/skills/quality/code-review
        run: bash .ci/scripts/setup-reviewer.sh

      - name: Review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .ci/scripts/run-review.sh

      - name: Drop the checkouts
        if: always()
        run: rm -rf .skills .ci
